<title>Ejecución</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: modo enfoque. Una sola columna de 560px; la tarea principal es lo único destacado. Sin cajas: espacio en blanco y líneas finas. Un solo color de acento, reservado para la P1 y la acción de enfocar. */
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --sunken:#F1F1EF; --ink:#16171A; --muted:#7C7F87; --faint:#B4B6BC; --line:#E9E9E6;
  --accent:#E2541B; --accent-ink:#FFFFFF; --accent-soft:#FCEBE3;
  --ok:#2F8A4E; --ok-soft:#E3F2E8; --warn:#C2362B;
  --grass:#CFE6B0; --grass-2:#C4DEA2; --grass-side:#A3CA7B; --earth:#C49A6C; --earth-2:#AB8259;
  --tree:#3F9A55; --tree-2:#6DB46F; --trunk:#9A6E4C; --wilt:#D4B157; --dead:#A89786; --hi:rgba(255,255,255,.3); --shade:rgba(0,0,0,.1);
  --p1:var(--accent); --ticket-line:var(--line);
  --f-sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#18181B; --sunken:#1E1E22; --ink:#EDEDEF; --muted:#8B8C94; --faint:#55565D; --line:#26262B;
  --accent:#FF7A3D; --accent-ink:#111113; --accent-soft:#33211A;
  --ok:#5CC27F; --ok-soft:#18291F; --warn:#FF7468;
  --grass:#33502E; --grass-2:#2D4829; --grass-side:#284224; --earth:#5E4532; --earth-2:#4D3828;
  --tree:#58B86E; --tree-2:#3F955A; --trunk:#7D5E46; --wilt:#B8973E; --dead:#857668; --hi:rgba(255,255,255,.16); --shade:rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#18181B; --sunken:#1E1E22; --ink:#EDEDEF; --muted:#8B8C94; --faint:#55565D; --line:#26262B;
  --accent:#FF7A3D; --accent-ink:#111113; --accent-soft:#33211A;
  --ok:#5CC27F; --ok-soft:#18291F; --warn:#FF7468;
  --grass:#33502E; --grass-2:#2D4829; --grass-side:#284224; --earth:#5E4532; --earth-2:#4D3828;
  --tree:#58B86E; --tree-2:#3F955A; --trunk:#7D5E46; --wilt:#B8973E; --dead:#857668; --hi:rgba(255,255,255,.16); --shade:rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.muted{color:var(--muted)}
.acc{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.topbar-in{max-width:592px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:4px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-right:auto}
.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--muted)}
.icon-btn:hover{color:var(--ink);background:var(--sunken)}
.icon-btn svg{width:19px;height:19px}
main{max-width:592px;width:100%;margin:0 auto;padding-inline:16px;padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:2px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;font-size:11px;font-weight:600;color:var(--faint);cursor:pointer;border-radius:10px;position:relative;min-width:62px}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .badge{position:absolute;top:4px;left:calc(50% + 7px);width:7px;height:7px;border-radius:50%;background:var(--accent);font-size:0}
@media (min-width:960px){
  .nav{top:0;bottom:auto;left:0;right:auto;height:100vh;flex-direction:column;justify-content:flex-start;padding:72px 14px 14px;width:180px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  .nav button{flex-direction:row;gap:10px;font-size:14px;padding:9px 12px}
  .nav .badge{position:static;margin-left:auto}
  main{padding-block:24px 64px}
}

/* ---------- type ---------- */
.date{font-size:13px;color:var(--muted);font-weight:500}
.label{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.label .note{font-weight:500;letter-spacing:0;text-transform:none}
.label .text-btn{margin-left:auto}
.page-title{font-size:28px;font-weight:700}
.page-sub{color:var(--muted);margin-top:2px}
.page-head{margin:8px 0 28px}
.block{margin-top:44px}
.sep{color:var(--faint);margin:0 6px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:50px;padding:0 26px;font-size:15.5px;border-radius:14px}
.btn.danger{color:var(--warn)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.text-btn,.link{border:0;background:none;padding:6px 2px;font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer;text-transform:none;letter-spacing:0;white-space:nowrap}
.text-btn:hover,.link:hover{color:var(--accent)}
.text-btn.muted{color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:var(--sunken);font-size:15px}
textarea{min-height:80px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--faint);background:var(--surface)}
label.field{display:grid;gap:6px;font-size:13.5px;font-weight:600}
label.field .hint{font-weight:500;color:var(--muted);font-size:12.5px}
.row-form{display:flex;gap:8px;align-items:center}
.row-form input{flex:1;min-width:0}
.row-form select{width:auto;flex:none}

.pill{font-size:12px;font-weight:700}
.pill.p1{color:var(--accent)}
.pill.p2,.chip{color:var(--muted);font-size:12.5px;font-weight:500}
.pill.ok{color:var(--ok)}
.ex{font-size:11.5px;font-weight:600;color:var(--faint);font-style:italic}

/* ---------- foco: la P1 ---------- */
.focus-block{padding:36px 0 8px;display:grid;gap:12px}
.p1-title{font-size:clamp(28px,7.4vw,38px);font-weight:700;line-height:1.12}
.p1-title.empty{color:var(--faint)}
.p1-title.done{color:var(--faint);text-decoration:line-through;text-decoration-thickness:2px}
.p1-meta{color:var(--muted);font-size:14px}
.p1-actions{display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.p1-actions .more{margin-left:auto}
.win{color:var(--ok);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.notices{display:grid;gap:4px;margin-top:18px}
.notice{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:var(--muted)}
.notice::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none;transform:translateY(-2px)}
.notice.acc::before{background:var(--accent)}
.notice.warn::before{background:var(--warn)}
.notice>span{flex:1 1 auto;min-width:0}
.notice b{color:var(--ink);font-weight:600}
.notice .text-btn{padding:0;font-size:13px}
.ticket{border-radius:14px;padding:16px;background:var(--surface);display:grid;gap:6px}
.tk-top{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.tk-front{font-weight:600}
.tk-title{font-size:21px;font-weight:700;line-height:1.2}

/* ---------- filas ---------- */
.list{display:grid}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
.trow:first-child{border-top:0}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--ok)}
.check svg{width:12px;height:12px;opacity:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on svg{opacity:1}
.check.on path{stroke:var(--bg)}
.tmain{flex:1;min-width:0;display:grid;gap:1px}
.ttitle{font-weight:500;overflow-wrap:anywhere}
.trow.done .ttitle{text-decoration:line-through;color:var(--faint)}
.tmeta{font-size:12.5px;color:var(--muted)}
.more{width:32px;height:32px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--faint);flex:none;display:grid;place-items:center}
.more:hover{background:var(--sunken);color:var(--ink)}
.more svg{width:17px;height:17px}
.add-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--muted)}
.add-line .plus{width:22px;text-align:center;color:var(--faint);font-size:18px;line-height:1}
.add-line input{background:transparent;padding:6px 0;min-height:36px;border:0}
.add-line input:focus{background:transparent;border:0}
.add-line select{background:transparent;min-height:36px;padding:4px 6px;font-size:13px;color:var(--muted)}
.empty{padding:14px 0;color:var(--muted);font-size:14px}

/* ---------- hábitos ---------- */
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .tmain{gap:0}
.toggle{display:flex;gap:4px}
.toggle button{min-height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.toggle button.on-full{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.toggle button.on-min{border-color:var(--ok);color:var(--ok)}
.dots{display:flex;justify-content:space-between;max-width:320px;margin-top:16px}
.dot{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--faint);font-weight:600}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot i.win{background:var(--ok)}
.dot i.min{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ok)}
.dot i.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}
.dot.today{color:var(--ink)}
.tonight{display:flex;align-items:center;gap:12px;margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.tonight .grow{flex:1;min-width:0;color:var(--muted)}
.tonight b{color:var(--ink);font-weight:600}

/* ---------- frentes / metas / semana ---------- */
.front{margin-bottom:40px}
.front-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.front-head h2{font-size:20px;font-weight:700;flex:1;min-width:0}
.front-sub{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.front-sub b{color:var(--ink);font-weight:600}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.frow:first-child{border-top:0}
.card{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:10px}
.kv{display:grid;gap:1px;font-size:14.5px;margin:0}
.kv dt{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.kv dd{margin:0}
.goal{margin-bottom:44px;display:grid;gap:14px}
.goal h2{font-size:24px;font-weight:700;line-height:1.15}
.bar{height:3px;border-radius:2px;background:var(--line);position:relative}
.bar>span{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:2px}
.bar>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent);border-radius:1px}
.bar-legend{font-size:12.5px;color:var(--muted);margin-top:8px}
.kvs{display:grid;gap:12px}
details{border-top:1px solid var(--line);padding-top:12px}
details>summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;color:var(--muted)}
details>summary:hover{color:var(--ink)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;font-weight:500;color:var(--faint)}
details[open]>summary::after{content:"–"}
details>.d-body{padding-top:10px;display:grid;gap:6px}
.wk{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.wk .n{font-size:12px;color:var(--faint);width:30px;flex:none;font-weight:600}
.wk.cur{font-weight:700}
.wk.cur .n{color:var(--accent)}
.pm{display:grid;gap:10px;font-size:14px}
.pm div{display:grid;gap:1px}
.pm span{color:var(--muted);font-size:13px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.qa{display:grid;gap:22px}
.step-n{color:var(--faint);font-weight:700;margin-right:6px}
.checkline{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}
.checkline input{width:18px;height:18px;accent-color:var(--ink)}
.grid3{display:grid;gap:12px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:86vh;padding:24px}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sheet-head h2{flex:1;font-size:20px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid transparent;border-radius:12px;cursor:pointer;font-weight:600;font-size:14.5px}
.opt:hover{border-color:var(--line)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.opt.sel{border-color:var(--ink)}
.opt.danger{color:var(--warn)}
.opt .grow{flex:1;min-width:0}
.group-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}
.guide h3{font-size:15px;margin-top:10px}
.guide p,.guide li{font-size:14px}
.guide ul,.guide ol{margin:0;padding-left:20px;display:grid;gap:4px}
.tpl{font-family:var(--f-mono);font-size:12.5px;background:var(--surface);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-x:auto;line-height:1.6}
.stack{display:grid;gap:10px}

/* ---------- enfoque ---------- */
.focus{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.focus-in{width:100%;max-width:420px;display:grid;gap:24px;justify-items:center;text-align:center}
.focus .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.focus h2{font-size:22px;font-weight:700}
.ring{width:min(68vw,250px);aspect-ratio:1;position:relative;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{stroke-width:2.5}
.ring .time{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(44px,13vw,60px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.presets button{min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:600;cursor:pointer;color:var(--muted)}
.presets button.on{border-color:var(--ink);color:var(--ink)}
textarea.auto{min-height:44px;height:44px;resize:none;overflow:hidden;line-height:1.45;padding-block:11px}
.adjust{display:flex;align-items:center;gap:18px}
.adjust span{font-weight:700;font-size:16px;min-width:64px;text-align:center}
.adjust button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer}
.focus-note{font-size:13.5px;color:var(--muted);max-width:34ch}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;width:max-content;max-width:calc(100% - 32px)}
@media (min-width:960px){.toast{bottom:28px}}
.banner{background:var(--sunken);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.loading{padding:60px 0;text-align:center;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- v3: casillas claras + ayuda "!" ---------- */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-head h1{font-size:28px;font-weight:700}
.sec-head .count{font-size:13px;color:var(--muted);font-weight:600}
.sec-head .count.ok{color:var(--ok)}
.sec-head .text-btn{margin-left:auto}
.sec-head .info{margin-left:auto}
.sec-head .text-btn + .info{margin-left:6px}
.date-title{font-size:26px;font-weight:700;letter-spacing:-.02em}
.info{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);background:transparent;color:var(--muted);font-weight:800;font-size:13px;line-height:1;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.info:hover{border-color:var(--accent);color:var(--accent)}
.block{margin-top:36px}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--faint)}
.check svg{width:14px;height:14px}
.check.big{width:30px;height:30px;border-radius:9px}
.check.big svg{width:17px;height:17px}
.check.half{background:var(--ok-soft);border-color:var(--ok)}
.check.half svg{opacity:1}
.check.half path{stroke:var(--ok)}
.trow{min-height:56px}
.trow.plain{border-top:0;padding-top:0}
.trow.cur .tmeta{color:var(--accent)}
.ttitle{font-size:15.5px}
.main-task{display:flex;align-items:center;gap:14px;padding:18px 14px 18px 18px;background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
.main-task .mt-title{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.main-task.done .mt-title{text-decoration:line-through;color:var(--faint)}
.main-task .tmain{gap:4px}
.ok{color:var(--ok);font-weight:600}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:18px;height:18px;margin-left:2px}
.play.small{width:34px;height:34px;background:var(--sunken);color:var(--ink)}
.play.small svg{width:13px;height:13px}
.play:hover{filter:brightness(1.07)}

<script>
(function(){
"use strict";
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const dow = s => parse(s).getDay();
const monday = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); };
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = (s, o) => new Intl.DateTimeFormat("es-CO", o).format(parse(s));
const fmtShort = s => fmt(s, {day:"numeric", month:"short"});
const fmtDay = s => s.slice(0, 4) === today().slice(0, 4) ? fmtShort(s) : fmt(s, {day:"numeric", month:"short", year:"numeric"}); // con año si no es de este año
const DAYS = ["D","L","M","X","J","V","S"];
const DAYNAMES = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const ICON = {
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const exB = o => o && o.example ? '<span class="ex">ejemplo</span>' : "";

/* ================= estado ================= */
const S = { tasks:[], fronts:[], goals:[], habits:[], reviews:[], settings:{}, focus:{days:{}} };
const SOURCES = ["tasks","fronts","goals","habits","reviews","settings","focus"];
const ready = new Set();
let db = null, mode = "connecting";
let view = "hoy";
try { const v = localStorage.getItem("ej-view"); if (v && ["hoy","bandeja","frentes","metas","semana"].includes(v)) view = v; } catch(e){}

/* ================= escritura ================= */
const queue = {};
function clean(o){ return JSON.parse(JSON.stringify(o)); }
function writeErr(e){
  const c = e && e.code;
  if (c === "quota_exceeded") toast("El almacenamiento está lleno. Borra tareas hechas antiguas.");
  else if (c === "invalid_argument") toast("No se pudo guardar ese cambio.");
  else if (c === "revoked") toast("Se perdió el acceso. Recarga la página.");
  else toast("No se pudo guardar. Revisa tu conexión.");
}
function run(path, fn){
  queue[path] = (queue[path] || Promise.resolve()).then(() => fn().catch(e => {
    if (e && e.code === "unavailable") return new Promise(r => setTimeout(r, 600 + Math.random()*600)).then(fn).catch(writeErr);
    writeErr(e);
  }));
}
function put(col, obj){
  const { id, ...body } = obj;
  body.updated = Date.now();
  if (mode !== "db"){
    if (col === "meta") S[id] = body;
    else { const arr = S[col]; const i = arr.findIndex(x => x.id === id); const next = {id, ...body}; if (i >= 0) arr[i] = next; else arr.push(next); }
    sched(); return;
  }
  const data = clean(body);
  run(col + "/" + id, () => db.doc(col + "/" + id).set(data));
}
function remove(col, id){
  if (mode !== "db"){ S[col] = S[col].filter(x => x.id !== id); sched(); return; }
  run(col + "/" + id, () => db.doc(col + "/" + id).delete());
}
const putMeta = (k, body) => put("meta", {id:k, ...body});

/* ================= consultas ================= */
const byOrder = (a,b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name);
const active = () => S.fronts.filter(f => f.status === "active").sort(byOrder);
const isHabitFront = f => !!f && f.kind === "habit"; // frente de hábito: lo mismo cada día, sin tareas
const projects = () => active().filter(f => !isHabitFront(f)); // solo los proyectos ocupan los 2 cupos
const frozen = () => S.fronts.filter(f => f.status !== "active").sort(byOrder);
const front = id => S.fronts.find(f => f.id === id);
const task = id => S.tasks.find(t => t.id === id);
const crit = d => S.tasks.find(t => t.date === d && t.slot === "critical");
const crits = d => S.tasks.filter(t => t.date === d && t.slot === "critical").sort((a,b) => byOrder(front(a.frontId) || {}, front(b.frontId) || {})); // una Principal por proyecto (máx. 2)
const critOf = (d, fid) => S.tasks.find(t => t.date === d && t.slot === "critical" && (t.frontId || null) === (fid || null));
const dayWon = d => { const cs = crits(d); return cs.length > 0 && cs.every(t => t.done); }; // ganado: todas las Principales del día hechas
const dueOn = (f, d) => { if (!f || isHabitFront(f) || paused(f, d)) return false; const h = S.habits.find(x => x.frontId === f.id); return h ? daysOn(h, d) : [1,2,3,4,5].includes(dow(d)); }; // días del hábito del proyecto; sin hábito, de lunes a viernes
const nextTask = fid => S.tasks.filter(t => t.frontId === fid && !t.done && !t.slot && !t.someday).sort((a,b) => (a.created||0) - (b.created||0))[0]; // la siguiente en el orden en que las escribiste
const secs = d => S.tasks.filter(t => t.date === d && t.slot === "secondary").sort((a,b) => (a.created||0) - (b.created||0));
const inbox = () => S.tasks.filter(t => !t.frontId && !t.done && !t.slot && !t.someday).sort((a,b) => (a.created||0) - (b.created||0));
const ideas = () => S.tasks.filter(t => !t.frontId && !t.done && !t.slot && t.someday).sort((a,b) => String(b.someday).localeCompare(String(a.someday)) || (b.created||0) - (a.created||0)); // notas congeladas «para algún día», la más reciente arriba
const habits = () => S.habits.slice().sort(byOrder);
const goalWeeks = g => (g && g.start && g.deadline && g.deadline >= g.start) ? Math.max(1, Math.min(52, Math.ceil((diffDays(g.start, g.deadline) + 1) / 7))) : 12;
const pauseFrom = f => { const p = (f.pauses || []).find(x => !x.to); return p ? p.from : f.status !== "active" ? "2000-01-01" : null; }; // día en que se congeló (sin pausas: desde siempre)
const isFrozen = fid => { const f = front(fid); return !!f && f.status !== "active"; };
const goalDone = g => { const N = g.start && g.deadline ? goalWeeks(g) : 0; return N > 0 && (g.weekly || []).slice(0, N).filter(w => w && w.done).length === N; }; // todas sus semanas marcadas («Cumplido»)
const liveGoals = f => { const p = (f.pauses || []).find(x => !x.to), from = p ? p.from : today(); // los que seguían vivos al congelarlo (o se crearon sin fechas); primero los que tienen fechas
  return S.goals.filter(g => g.frontId === f.id && (!g.deadline || g.deadline >= from) && !goalDone(g)).sort((a,b) => String(a.start||"9999").localeCompare(String(b.start||"9999"))); };
const planGoal = f => liveGoals(f)[0];
const goalFor = fid => S.goals.filter(g => g.frontId === fid && (!g.deadline || g.deadline >= today())).sort((a,b) => String(a.start||"9999").localeCompare(String(b.start||"9999")))[0];
const scheduled = (h, d) => { const f = h.frontId && front(h.frontId); return !(f && paused(f, d)) && (h.days || []).includes(dow(d)); }; // un día con el frente congelado no toca
const settings = () => S.settings || {};

function streak(h){
  const log = h.log || {}; let d = today(), n = 0;
  if (!log[d]) d = addDays(d, -1);
  for (let i = 0; i < 500; i++){
    if (h.created && d < h.created) break;
    if (log[d] && (h.days || []).includes(dow(d))) n++; else if (scheduled(h, d)) break; // lo que hiciste el día que congelaste sigue contando
    d = addDays(d, -1);
  }
  return n;
}
function missedRun(h){ // cuántos días programados seguidos se fallaron antes de hoy (mira los 2 últimos; un tramo congelado corta la cuenta)
  const log = h.log || {}, f = h.frontId && front(h.frontId); let d = today(), n = 0, seen = 0;
  for (let i = 0; i < 21 && seen < 2; i++){
    d = addDays(d, -1);
    if ((h.created && d < h.created) || (f && paused(f, d))) break;
    if (!scheduled(h, d)) continue;
    seen++; if (log[d]) break; n++;
  }
  return n;

function assign(id, date, slot, quiet){
  const t = task(id); if (!t) return false;
  if (slot === "critical"){ // una Principal por proyecto: reemplaza la de su frente
    const cur = critOf(date, t.frontId);
    if (cur && cur.id !== id && cur.done){ toast("La Principal de ese frente ya está hecha ese día. Añade esta como extra."); return false; }
    if (cur && cur.id !== id) put("tasks", {...cur, date:null, slot:null});
    else if (!cur && crits(date).filter(x => x.id !== id).length >= 2){ toast("Ese día ya tiene 2 Principales. Es el máximo."); return false; }
  } else {
    const s = secs(date).filter(x => x.id !== id);
    if (s.length >= 2){ toast("Ese día ya tiene 2 extras. Es el máximo."); return false; }
  }
  const {since, ...t0} = t; put("tasks", {...t0, ...keepMiss(t), date, slot, done:false, doneAt:null});
  if (!quiet){
    const when = date === today() ? "hoy" : date === addDays(today(),1) ? "mañana" : fmtShort(date);
    toast(slot === "critical" ? `Principal de ${when} lista.` : `Extra de ${when} listo.`);
  }
  return true;
}

  projects().forEach(f => {
    const k = d + "|" + f.id; if (PLANNED.has(k) || critOf(d, f.id)) return;
    const late = S.tasks.filter(t => t.frontId === f.id && t.slot === "critical" && !t.done && t.date && t.date < d).sort((a,b) => a.date.localeCompare(b.date));
    if (late.length){ PLANNED.add(k); const t = late[0];
      put("tasks", {...t, ...(dueOn(f, t.date) ? {missed:[...(t.missed || []), t.date]} : {}), since:t.since || t.date, date:d}); // vencida: pasa a hoy y el día fallado queda guardado
      late.slice(1).forEach(x => put("tasks", {...x, ...(dueOn(f, x.date) ? {missed:[...(x.missed || []), x.date]} : {}), date:null, slot:null}));

/* ---------- tu bloque y el Plan B (debajo de la fecha, de lunes a viernes) ---------- */
const fmtHour = hm => { const [h, m] = String(hm).split(":").map(Number); const x = new Date(); x.setHours(h, m || 0, 0, 0); return new Intl.DateTimeFormat("es-CO", {hour:"numeric", minute:"2-digit"}).format(x); };
function dayLine(){ // "block" · "planb" · "pick" · "" (fin de semana)
  const d = today(), w = dow(d), st = settings(), won = dayWon(d);
  if (w === 0 || w === 6) return {k:"", html:""};
  const now = new Date(), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (st.planBTime && hm >= st.planBTime && !won) return {k:"planb", html:'<p class="notice warn day-line"><span>Plan B activo: hoy solo el mínimo</span></p>'};
  if (st.fixedTime) return {k:"block", html:`<p class="notice day-line"><span>Tu bloque: ${esc(fmtHour(st.fixedTime))}</span></p>`};
  return {k:"pick", html:""}; // sin hora fija no se pide nada aquí: se elige en Ajustes
}

VIEWS.metas = function(){

function freezeFront(f){ // congela y saca del plan sus tareas pendientes (la Principal fallada queda guardada); devuelve el aviso
  const out = S.tasks.filter(t => t.frontId === f.id && t.slot && !t.done);
  out.forEach(t => put("tasks", {...t, ...keepMiss(t), slot:null, date:null}));
  put("fronts", {...f, status:"frozen", pauses:[...(f.pauses || []), {from:today()}]});
  return [`${f.name} congelado.`, S.habits.some(h => h.frontId === f.id) ? "Su hábito queda en pausa." : "", out.length === 1 ? `Salió de tu plan: ${out[0].title}.` : out.length ? `Salieron ${out.length} tareas de tu plan.` : ""].filter(Boolean).join(" ");
}
function activateFront(f){ put("fronts", {...f, status:"active", order: active().length + 1, pauses:(f.pauses || []).length ? f.pauses.map(p => p.to ? p : {...p, to:today()}) : [{from:"2000-01-01", to:today()}]}); }
function actDates(f, g){ // fechas al activar: sin avance empiezas de nuevo con la misma duración; con avance, la fecha límite se corre lo que estuvo congelado
  const hk = isHabitFront(f), t = today(), st0 = hk ? t : (dow(t) === 1 ? t : addDays(monday(t), 7));
  const dated = g.start && g.deadline, len = dated ? diffDays(g.start, g.deadline) : (hk ? 20 : 27);
  const lvl = dated ? forestMap(g) : {}, prog = dated && ((g.weekly || []).some(w => w && w.done) || Object.keys(lvl).some(d => d >= g.start && d <= g.deadline));
  if (!prog) return {start:st0, deadline:addDays(st0, len), shift:0};
  const p0 = pauseFrom(f) || t; let shift = 0; for (let d = p0 > g.start ? p0 : g.start; d < t; d = addDays(d, 1)) if (paused(f, d)) shift++; // solo el tramo que se cierra ahora
  return {start:g.start, deadline:addDays(g.deadline, shift), shift};
}
const durTxt = (hk, s, e) => hk ? plural(diffDays(s, e) + 1, "día", "días") : plural(goalWeeks({start:s, deadline:e}), "semana", "semanas");

/* ----- copia de seguridad: descargar todo en un archivo y restaurarlo (reemplaza todo) ----- */
const COLS = ["fronts", "tasks", "goals", "habits", "reviews"];
const ID_OK = /^(?!\.\.?$)[A-Za-z0-9_\-.~:@+]{1,200}$/;
let dl = null; // downloads: null si este visor no puede guardar archivos (se oculta el botón)
let RS = null, restoring = false; // copia leída, esperando las dos confirmaciones; restoring: hay una restauración en curso
const loaded = () => mode === "local" || (mode === "db" && ready.size === SOURCES.length); // copiar o restaurar antes de cargar daría una copia vacía
function backupData(){
  const data = {}; COLS.forEach(c => { data[c] = clean(S[c]); });
  data.meta = { settings:clean(S.settings || {}), focus:clean(S.focus || {days:{}}) };
  return { app:"ejecucion", version:1, exported:new Date().toISOString(), data };
}
const countLine = d => join([plural(d.fronts.length, "frente", "frentes"), plural(d.tasks.length, "tarea", "tareas"), plural(d.goals.length, "objetivo", "objetivos"), plural(d.habits.length, "hábito", "hábitos"), plural(d.reviews.length, "revisión", "revisiones")]);
async function backupSave(){
  if (!dl) return;
  if (!loaded()){ toast("Espera a que carguen tus datos."); return; }
  try {
    await dl.save({ filename:`ejecucion-${today()}.json`, data:JSON.stringify(backupData(), null, 1) });
    putMeta("settings", {...settings(), lastBackup:today()}); toast("Copia guardada.");
    document.querySelectorAll("#modal [data-act=backup] small").forEach(x => { x.textContent = "Última copia: hoy"; });
  } catch(e){
    const c = e && e.code; if (c === "declined") return;
    if (c === "rate_limited"){ toast("Espera un momento y vuelve a intentarlo."); return; }
    if (!["too_large", "bad_request", "transform_error", "rejected_extension", "extension_not_enabled", "request_unknown"].includes(c)){ // aquí no se pueden guardar archivos: se quita el botón
      dl = null; document.querySelectorAll("#modal [data-act=backup]").forEach(x => x.remove());
      toast("Aquí no se pueden descargar archivos. Ábrela en claude.ai."); return;
    }
    toast("No se pudo descargar la copia.");
  }
}
function backupParse(text){ // los datos de la copia, o null si el archivo no sirve
  let j; try { j = JSON.parse(text); } catch(e){ return null; }
  if (!j || j.app !== "ejecucion" || !j.data || typeof j.data !== "object") return null;
  const isObj = o => !!o && typeof o === "object" && !Array.isArray(o), d = {};
  for (const c of COLS){
    const a = j.data[c] || [];
    if (!Array.isArray(a) || !a.every(x => isObj(x) && typeof x.id === "string" && ID_OK.test(x.id)) || new Set(a.map(x => x.id)).size !== a.length) return null;
    d[c] = a;
  }
  const m = isObj(j.data.meta) ? j.data.meta : {};
  if ((m.settings !== undefined && !isObj(m.settings)) || (m.focus !== undefined && !isObj(m.focus))) return null;
  d.meta = { settings:m.settings || {}, focus:m.focus && isObj(m.focus.days) ? m.focus : {days:{}} };
  const t = Date.parse(j.exported);
  return { exported:isNaN(t) ? null : ymd(new Date(t)), data:d };
}
function restorePick(input){
  const f = input.files && input.files[0]; if (!f) return;
  if (!loaded() || restoring){ input.value = ""; toast("Espera a que carguen tus datos."); return; }
  f.text().then(t => {
    input.value = ""; const b = backupParse(t);
    if (!b){ toast("Ese archivo no es una copia de Ejecución."); return; }
    RS = b; confirmKey = null; restoreSheet();
  }).catch(() => toast("No se pudo leer el archivo."));
}
function restoreSheet(){
  openModal(() => {
    if (!RS) return "";
    const d = RS.data, sure = confirmKey === "restore";
    return sheet("Restaurar", `<p style="font-weight:700">Copia${RS.exported ? ` del ${fmtShort(RS.exported)}` : ""}</p>
      <p class="muted">${countLine(d)}</p>
      ${RS.failed ? `<p class="notice warn"><span>La restauración quedó a medias (${RS.failed}). Toca <b>Reemplazar mis datos</b> para terminarla.</span></p>` : ""}
      <p>Reemplaza todo lo que tienes ahora (${countLine(S)}). No se puede deshacer.</p>
      ${dl ? `<button class="opt" data-act="backup"><span class="grow">Antes, descargar mis datos actuales<small>Por si quieres volver a como está hoy.</small></span></button>` : ""}
      <button class="btn ${sure ? "danger" : "primary"} block" data-act="restore-do">${sure ? "Toca otra vez: se reemplaza todo" : "Reemplazar mis datos"}</button>`);
  });
}
async function restoreRun(d){ // una escritura a la vez, en orden; si se corta, se puede repetir con el mismo archivo
  const lb = [settings().lastBackup, d.meta.settings.lastBackup].filter(Boolean).sort().pop();
  if (lb) d.meta.settings = {...d.meta.settings, lastBackup:lb}; // no olvidar la copia que acabas de descargar
  const ops = [];
  COLS.forEach(c => {
    const keep = new Set(d[c].map(x => x.id));
    S[c].filter(x => !keep.has(x.id)).forEach(x => ops.push({ path:c + "/" + x.id }));
    d[c].forEach(({id, ...body}) => ops.push({ path:c + "/" + id, data:body }));
  });
  ops.push({ path:"meta/settings", data:d.meta.settings }, { path:"meta/focus", data:d.meta.focus });
  if (mode !== "db"){
    COLS.forEach(c => { S[c] = clean(d[c]); }); S.settings = clean(d.meta.settings); S.focus = clean(d.meta.focus);
    RS = null; closeModal(); sched(); toast("Datos restaurados."); return;
  }
  restoring = true;
  openModal(() => sheet("Restaurando", `<p>Restaurando <b id="rs-n">0</b> de ${ops.length}…</p><p class="muted">No cierres la app.</p>`, false), false);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let i = 0;
  for (const op of ops){
    for (let k = 0; ; k++){
      try { await (op.data ? db.doc(op.path).set(clean(op.data)) : db.doc(op.path).delete()); break; }
      catch(e){
        const c = e && e.code;
        if ((c === "unavailable" || c === "resource_exhausted") && k < 4){ await wait(400 * 2 ** k + Math.random() * 300); continue; }
        restoring = false; RS.failed = `${i} de ${ops.length}`; confirmKey = null; restoreSheet(); return;
      }
    }
    i++; const n = document.getElementById("rs-n"); if (n) n.textContent = i;
  }
  restoring = false; RS = null; closeModal(); toast("Datos restaurados.");
}

    <ol><li><b>Durante el día:</b> lo que se te ocurra va a la Bandeja.</li><li><b>Cada noche, 5 min:</b> en Hoy → <b>Planear mañana</b>. Vacías la Bandeja (cada nota va a un frente, queda hecha o se congela para algún día) y eliges la principal de mañana y hasta 2 extras.</li><li><b>Al día siguiente:</b> a la hora de <b>tu bloque</b> toca ▶ en la principal, trabaja y marca la casilla. En los hábitos con tiempo, toca ▶ y se marcan solos al terminar.</li><li><b>Si sales tarde:</b> pasada tu hora de Plan B, Hoy te avisa: solo el mínimo.</li><li><b>Día malo:</b> si no terminas la principal, haz el mínimo y toca <b>Solo mínimo</b> en el hábito.</li></ol>

    <h3>Reglas</h3>
    <ul><li>Una sola principal por día. Si la cumples, el día está ganado.</li><li>Nunca falles dos veces seguidas: después de un fallo, el mínimo es obligatorio.</li><li>Decide la noche anterior. De día solo ejecutas.</li><li>Si una tarea te da pereza, está mal definida: pártela.</li></ul>
    <h3>Cómo escribir una tarea</h3>
    <div class="tpl">[Verbo] + [qué exactamente] — [tiempo]
Bien: Resolver la sala de THM sobre XSS — 60 min
Mal: Avanzar en THM (no se puede empezar sin pensar)</div>

Ej: Cuando termine de cenar, abro el laboratorio en el escritorio.</div>

    <p class="muted">Ante cualquiera: solo el mínimo hasta recuperar la racha.</p></div>`), false); modal.guard = false;

const F = { kind:"task", id:null, total:25*60, remain:25*60, endAt:0, running:false, timer:null, logged:0, finished:false, lock:null };
function focusOpen(id){
  const t = task(id), m = (t && t.minutes) || 25;
  Object.assign(F, { kind:"task", id, base:m, total:m*60, remain:m*60, running:false, finished:false, logged:0 });

}
function focusHabit(id){ // ▶ en un hábito con tiempo: arranca de una con lo que falta de hoy
  const h = S.habits.find(x => x.id === id); if (!h || !h.minutes) return;
  const d = today(), done = (h.time || {})[d] || 0, left = Math.max(1, h.minutes - done), g = forestGoal(h.frontId);
  Object.assign(F, { kind:"habit", id, day:d, done0:done, base:left, total:left*60, remain:left*60, running:false, finished:false, logged:0,
    gid:g ? g.id : null, lvl0:g ? (forestMap(g)[d] || 0) : 0, wilt0:!!g && forestWilting(g) });
  startTimer(); renderFocus();
}
function habitDone(h){ // pantalla final de un hábito: dice qué contó, sin preguntar nada
  const total = F.done0 + F.logged, goal = (h && h.minutes) || total, min = (h && h.minMinutes) || goal;
  const lvl = total >= goal ? 2 : total >= min ? 1 : 0, g = F.gid && S.goals.find(x => x.id === F.gid);
  const grow = g ? forestGrowMsg(g, F.lvl0, lvl, F.wilt0 && !F.lvl0).trim() : "";
  const headTxt = lvl === 2 ? "Hábito cumplido." : lvl === 1 ? "Mínimo cumplido." : `Llevas ${total} de ${goal} min.`;
  const note = lvl ? [lvl === 1 ? "La racha sigue viva." : "", grow].filter(Boolean).join(" ") : `El mínimo es ${min} min. Puedes seguir más tarde.`;
  return `<p style="font-size:18px;font-weight:700">${headTxt}</p>${note ? `<p class="focus-note">${esc(note)}</p>` : ""}
      <div class="presets"><button class="btn go" data-act="focus-finish">Listo</button></div>`;
}
function renderFocus(){
  if (!F.id){ $("#focus").innerHTML = ""; return; }
  const hk = F.kind === "habit", t = hk ? S.habits.find(x => x.id === F.id) : task(F.id);
  const m = Math.floor(F.remain/60), s = Math.floor(F.remain%60);
  const C = 2*Math.PI*54, frac = F.total ? F.remain/F.total : 0;
  $("#focus").innerHTML = `<div class="focus" role="dialog" aria-modal="true" aria-label="Enfoque"><div class="focus-in">

      <div class="presets"><button class="btn go" data-act="focus-finish" data-done="1">Sí, marcar hecha</button><button class="btn" data-act="focus-finish">Seguir otro día</button></div>`)
    : `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--ticket-line)" stroke-width="6"/><circle id="ringArc" cx="60" cy="60" r="54" fill="none" stroke="var(--p1)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><div class="time" id="ringTime">${pad(m)}:${pad(s)}</div></div>
      ${F.running || F.remain < F.total ? "" : `<div class="adjust"><button data-act="focus-adj" data-n="-5" aria-label="Quitar 5 minutos">−5</button><span>${Math.round(F.total/60)} min</span><button data-act="focus-adj" data-n="5" aria-label="Añadir 5 minutos">+5</button></div>
      <div class="presets">${[...new Set([10, F.base, 25, 50])].sort((a,b) => a-b).map(n => `<button class="${F.total === n*60 ? "on" : ""}" data-act="focus-preset" data-n="${n}">${n === F.base ? `${n} min · ${hk ? "hábito" : "tarea"}` : `${n} min`}</button>`).join("")}</div>`}
      <div class="presets"><button class="btn go" data-act="focus-toggle">${F.running ? "Pausar" : (F.remain < F.total ? "Seguir" : "Empezar")}</button><button class="btn" data-act="focus-stop">Terminar</button></div>
      <p class="focus-note">${F.total === 600 ? "Regla de los 10 minutos: solo te comprometes a empezar. Si al final quieres parar, paras y cuenta." : "Teléfono en otra habitación. Una sola pestaña abierta."}</p>`}
  </div></div>`;
}
function tick(){
  F.remain = Math.max(0, (F.endAt - Date.now())/1000);
  const el = $("#ringTime"), arc = $("#ringArc");
  if (el){ const m = Math.floor(Math.ceil(F.remain)/60), s = Math.ceil(F.remain)%60; el.textContent = `${pad(m)}:${pad(s)}`; }
  if (arc){ const C = 2*Math.PI*54; arc.setAttribute("stroke-dashoffset", C*(1 - F.remain/F.total)); }
  if (F.remain <= 0){ stopTimer(); logFocus(); F.finished = true; chime(); renderFocus(); }
}
function startTimer(){
  F.endAt = Date.now() + F.remain*1000; F.running = true;
  clearInterval(F.timer); F.timer = setInterval(tick, 250);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => F.lock = l).catch(() => {}); } catch(e){}
}
function stopTimer(){ F.running = false; clearInterval(F.timer); try { F.lock && F.lock.release(); } catch(e){} F.lock = null; }
function logFocus(){
  const mins = Math.floor((F.total - F.remain)/60) - F.logged;
  if (mins < 1) return;
  F.logged += mins;
  const days = {...(S.focus.days || {})}; const d = today(); days[d] = (days[d] || 0) + mins;
  putMeta("focus", {days});
  if (F.kind === "habit") habitTime(F.id, F.day, F.done0 + F.logged);
}
function habitTime(id, d, total){ // guarda los minutos del día y marca el hábito al llegar al mínimo o al tiempo
  const h = S.habits.find(x => x.id === id); if (!h) return;
  const time = {...(h.time || {})}; time[d] = Math.max(time[d] || 0, total);
  const log = {...(h.log || {})}, cur = log[d];
  if (h.minutes && time[d] >= h.minutes){ if (cur !== "full" && cur !== "auto") log[d] = "full"; }
  else if (!cur && h.minutes && time[d] >= (h.minMinutes || h.minutes)) log[d] = "min";
  put("habits", {...h, time, log});
}
function chime(){
  try { const A = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach((t, i) => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = [660, 880, 990][i]; g.gain.setValueAtTime(.0001, A.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, A.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, A.currentTime + t + .35); o.connect(g).connect(A.destination); o.start(A.currentTime + t); o.stop(A.currentTime + t + .4); }); } catch(e){}
}

  if (e.target.id === "g-front" && $("#g-stdmin")){ const box = $("#g-stdmin"); // cambiar de frente no borra lo escrito
    if ($("#g-standard")){ box.dataset.std = $("#g-standard").value; box.dataset.min = $("#g-minimum").value; }
    box.innerHTML = stdMinHtml(e.target.value, {standard:box.dataset.std, minimum:box.dataset.min}); growAll(); }
  if (e.target.id === "g-front" && $("#g-dates")){ const off = isFrozen(e.target.value), wb = $("#g-weeks-box"); $("#g-dates").hidden = off; if (wb){ wb.hidden = off; const dt = wb.closest("details"); if (dt && !off) dt.open = true; } } // a un frente activo: se ve el plan por semanas
  if (e.target.matches("[data-htime]")){ const box = e.target.closest(".hf"); if (box) box.dataset.timed = e.target.value ? "1" : "0"; }
  if (e.target.matches("#g-start,#g-deadline") && $("#g-dur")){ const L = $("#g-dur"), st = $("#g-start").value; // al activar, mover el inicio conserva la duración
    if (e.target.id === "g-start" && st) $("#g-deadline").value = addDays(st, +L.dataset.len);
    const dl = $("#g-deadline").value; if (st && dl >= st){ L.dataset.len = diffDays(st, dl); L.querySelector("b").textContent = durTxt(!!L.dataset.hk, st, dl); } }
  if (e.target.matches("#g-start,#g-deadline")){
    const st = $("#g-start").value, dl = $("#g-deadline").value, box = $("#g-weeks"); if (!box || !st || !dl) return;
    if (dl < st){ toast("La fecha límite debe ser después del inicio."); return; }
    const vals = [...box.querySelectorAll("textarea, input")].map(i => i.value);
    box.innerHTML = weekInputs(goalWeeks({start:st, deadline:dl}), vals); growAll();
  }
});

Object.assign(A, {
  "focus-preset"(d){ F.total = F.remain = +d.n * 60; renderFocus(); },
  "focus-adj"(d){ const m = Math.max(5, Math.min(180, Math.round(F.total/60) + +d.n)); F.total = F.remain = m * 60; renderFocus(); },
  "focus-toggle"(){ if (F.running){ stopTimer(); F.remain = Math.max(0, (F.endAt - Date.now())/1000); logFocus(); } else startTimer(); renderFocus(); },
  "focus-stop"(){ if (F.running){ F.remain = Math.max(0, (F.endAt - Date.now())/1000); stopTimer(); } logFocus(); F.finished = true; renderFocus(); },
  "focus-finish"(d){ if (d.done && F.kind !== "habit"){ const t = task(F.id); if (t && !t.done) toggleDone(F.id); } F.id = null; renderFocus(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && modal.render && !modal.guard) closeModal(); });
/* viento en el bosque: el dedo lo inclina mientras se mueve; al soltar, cada árbol vuelve meciéndose */
const WIND = { svg:null, x:0, lean:0 };
document.addEventListener("pointerdown", e => { const sv = e.target.closest && e.target.closest(".forest svg"); if (!sv) return; WIND.svg = sv; WIND.x = e.clientX; WIND.lean = 0; sv.classList.remove("calm"); });
document.addEventListener("pointermove", e => { const sv = WIND.svg; if (!sv) return;
  WIND.lean = Math.max(-14, Math.min(14, (e.clientX - WIND.x) * -.18)); sv.style.setProperty("--lean", WIND.lean + "deg"); });
const windEnd = () => { const sv = WIND.svg; if (!sv) return; WIND.svg = null;
  sv.style.setProperty("--from", WIND.lean + "deg"); sv.style.setProperty("--lean", "0deg"); void sv.getBoundingClientRect(); sv.classList.add("calm"); };
document.addEventListener("pointerup", windEnd); document.addEventListener("pointercancel", windEnd);
document.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.keep; if (k) e.target.open ? KEEP.add(k) : KEEP.delete(k); }, true);
document.addEventListener("visibilitychange", () => { if (!document.hidden && F.running) tick(); });

let lastDay = today(), lastLine = "";
setInterval(() => { const k = mode === "connecting" ? "" : dayLine().k; if (today() !== lastDay || k !== lastLine){ lastDay = today(); lastLine = k; sched(); planSoon(); } }, 60000); // cambio de día y paso al Plan B
async function init(){
  render();
  try { if (window.claude && window.claude.use) window.claude.use("downloads").then(x => { dl = x || null; }, () => {}); } catch(e){}
  let d = null;
  try { d = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ d = null; }
  if (!d){ mode = "local"; render(); return; }
  db = d; mode = "db";
  const onErr = e => { if (e && e.code === "revoked") toast("Se perdió el acceso. Recarga la página."); else toast("Se interrumpió la sincronización. Recarga la página."); };
  ["tasks","fronts","goals","habits","reviews"].forEach(c => {
    db.collection(c).onSnapshot(s => { S[c] = s.docs.map(x => ({id:x.id, ...x.data()})); ready.add(c); sched(); planSoon(); }, onErr);
  });
  ["settings","focus"].forEach(k => {
    db.doc("meta/" + k).onSnapshot(s => { S[k] = s.exists ? {...s.data()} : (k === "focus" ? {days:{}} : {}); ready.add(k); sched(); }, onErr);
  });
  render();
}
init();
})();
